name: Deploy to Mainnet

on:
  workflow_dispatch:
    inputs:
      release_review:
        description: 'Path to the release review record (docs/release-reviews/<release>.md), see docs/runbook.md §8'
        required: true
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    name: Deploy contracts
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Issue #125: no mainnet deploy without a release review that records
      # every readiness gate and a GO decision (docs/runbook.md §8).
      - name: Release review is GO
        env:
          REVIEW: ${{ github.event_name == 'push' && format('docs/release-reviews/{0}.md', github.ref_name) || github.event.inputs.release_review }}
        run: python3 scripts/check_release_review.py "$REVIEW"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.0.1/stellar-cli-22.0.1-x86_64-unknown-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      - name: Import deployer identity
        env:
          MAINNET_DEPLOYER_SECRET_KEY: ${{ secrets.MAINNET_DEPLOYER_SECRET_KEY }}
        run: |
          if [ -z "$MAINNET_DEPLOYER_SECRET_KEY" ]; then
            echo "MAINNET_DEPLOYER_SECRET_KEY secret is not set"
            exit 1
          fi
          stellar keys add deployer --secret-key "$MAINNET_DEPLOYER_SECRET_KEY"

      - name: Deploy contracts
        run: echo "yes" | ./scripts/deploy_mainnet.sh

      - name: Deployment summary
        run: |
          # Extract contract addresses from .env written by the deploy script
          ESCROW_ID=""
          ORACLE_ID=""
          if [ -f .env ]; then
            ESCROW_ID=$(grep -E '^CONTRACT_ESCROW=' .env | cut -d'=' -f2-)
            ORACLE_ID=$(grep -E '^CONTRACT_ORACLE=' .env | cut -d'=' -f2-)
          fi

          {
            echo "## Mainnet Deployment Summary"
            echo ""
            echo "| Field   | Value |"
            echo "| ------- | ----- |"
            echo "| Date    | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| Commit  | \`${{ github.sha }}\` |"
            echo "| Ref     | \`${{ github.ref }}\` |"
            echo ""
            echo "### Deployed Contracts"
            echo ""
            echo "| Contract | Address |"
            echo "| -------- | ------- |"
            if [ -n "$ESCROW_ID" ]; then
              echo "| Escrow   | \`${ESCROW_ID}\` |"
            else
              echo "| Escrow   | _not found in .env_ |"
            fi
            if [ -n "$ORACLE_ID" ]; then
              echo "| Oracle   | \`${ORACLE_ID}\` |"
            else
              echo "| Oracle   | _not found in .env_ |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
