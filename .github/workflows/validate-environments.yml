name: Validate Environments

# Also enforces environments.toml as the single source of truth for network
# and contract metadata (#118): see scripts/network_config.py.

on:
  push:
    branches: [master]
    paths:
      - environments.toml
      - scripts/validate_environments.py
      - scripts/test_validate_environments.py
      - scripts/network_config.py
      - scripts/test_network_config.py
      - scripts/deploy_testnet.sh
      - scripts/deploy_mainnet.sh
      - .env.example
      - apps/frontend/src/**
      - apps/backend/src/**
  pull_request:
    paths:
      - environments.toml
      - scripts/validate_environments.py
      - scripts/test_validate_environments.py
      - scripts/network_config.py
      - scripts/test_network_config.py
      - scripts/deploy_testnet.sh
      - scripts/deploy_mainnet.sh
      - .env.example
      - apps/frontend/src/**
      - apps/backend/src/**

jobs:
  validate-environments:
    name: Validate environments.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"

      - name: Validate environments.toml
        run: python scripts/validate_environments.py

      - name: Run validation tests
        run: python scripts/test_validate_environments.py

      - name: Every consumer matches environments.toml
        run: python scripts/network_config.py --check

      - name: Run network config tests
        run: python scripts/test_network_config.py
