name: Deploy to Testnet

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'contracts/**'

jobs:
  deploy:
    name: Deploy contracts
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.0.1/stellar-cli-22.0.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      - name: Import deployer identity
        env:
          DEPLOYER_SECRET: ${{ secrets.DEPLOYER_SECRET_KEY }}
        run: |
          if [ -z "$DEPLOYER_SECRET" ]; then
            echo "DEPLOYER_SECRET_KEY secret is not set — skipping deploy"
            exit 1
          fi
          stellar keys add deployer --secret-key "$DEPLOYER_SECRET"

      - name: Deploy
        run: ./scripts/deploy_testnet.sh

      - name: Upload contract addresses
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-addresses
          path: .env
