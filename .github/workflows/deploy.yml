name: Deploy to Testnet

concurrency:
  group: testnet-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'contracts/**'
  pull_request:
    paths:
      - 'contracts/**'

jobs:
  deploy:
    name: Deploy contracts
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && format('testnet-pr-{0}', github.event.pull_request.number) || 'testnet' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.0.1/stellar-cli-22.0.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      - name: Import deployer identity
        env:
          DEPLOYER_SECRET: ${{ secrets.DEPLOYER_SECRET_KEY }}
        run: |
          if [ -z "$DEPLOYER_SECRET" ]; then
            echo "DEPLOYER_SECRET_KEY secret is not set — skipping deploy"
            exit 1
          fi
          stellar keys add deployer --secret-key "$DEPLOYER_SECRET"

      - name: Deploy
        run: ./scripts/deploy_testnet.sh

      - name: Upload contract addresses
        uses: actions/upload-artifact@v4
        with:
          name: contract-addresses
          path: .env
